<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>大廚炒菜</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { color: #f3efe6; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  video { display: none; }
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #status { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 16px; font-size: 15px; font-weight: 600;
    padding: 7px 14px; border-radius: 999px; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); pointer-events: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
    background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0)); font-size: 14px; }
  #bar button { font: inherit; font-weight: 600; color: #fff; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px); }
  #bar label { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
    background: rgba(0,0,0,.45); backdrop-filter: blur(6px); cursor: pointer; }
  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; text-align: center; padding: 32px; background: #14213d; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 30px; font-weight: 700; letter-spacing: .06em; }
  #overlay p { color: #b8c0d4; line-height: 1.7; max-width: 34ch; }
  #start { font: inherit; font-size: 18px; font-weight: 700; color: #14213d; background: #f3efe6; border: 0;
    border-radius: 999px; padding: 14px 36px; cursor: pointer; }
  #err { color: #fca5a5; font-size: 14px; }
</style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <div id="status">尚未啟動</div>
  <div id="bar">
    <label><input type="checkbox" id="showCam" checked> 鏡頭畫面</label>
    <label><input type="checkbox" id="showHands" checked> 顯示手部骨架</label>
    <button id="flip">🔄 切換鏡頭</button>
  </div>
  <div id="overlay">
    <h1>👨‍🍳 大廚炒菜</h1>
    <p>把臉和手放到鏡頭前，頭上會戴上廚師帽。<br>握拳抓住平底鍋的手柄就能拿起鍋子，<br>用力搖晃，鍋子會噴出大火、菜會在鍋裡翻飛！</p>
    <button id="start">開啟鏡頭</button>
    <p id="err"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const overlay = document.getElementById('overlay');
    const errEl = document.getElementById('err');
    const showCam = document.getElementById('showCam');
    const showHands = document.getElementById('showHands');

    let W = 0, H = 0, U = 1;                 // U：以最短邊為基準的尺寸單位
    let mirror = true;                       // 前鏡頭鏡像，後鏡頭不鏡像
    let facing = 'user';
    let stream = null;
    let view = { x: 0, y: 0, w: 0, h: 0 };   // 鏡頭影像貼上的區域
    let frame = 0;

    // ---------- 畫布 / 鏡頭配置 ----------
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.width = Math.round(window.innerWidth * dpr);
      H = canvas.height = Math.round(window.innerHeight * dpr);
      U = Math.min(W, H) / 400;
      layoutVideo();
      placeStove();
    }
    function layoutVideo() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) { view = { x: 0, y: 0, w: W, h: H }; return; }
      // 像相機 App：保持鏡頭原始比例，填滿寬度（直式）或高度（橫式），其餘留黑
      const s = Math.min(W / vw, H / vh);
      view.w = vw * s; view.h = vh * s;
      view.x = (W - view.w) / 2; view.y = (H - view.h) / 2;
    }
    const toScreen = p => ({ x: view.x + (mirror ? 1 - p.x : p.x) * view.w, y: view.y + p.y * view.h });

    // ---------- 炒台與平底鍋 ----------
    const pan = {
      x: 0, y: 0,          // 手柄握點
      ang: 0,              // 鍋身方向（弧度）
      restX: 0, restY: 0, restAng: 0,
      heldBy: -1,          // 哪一隻手拿著（-1 = 沒有）
      handleLen: 0, r: 0,
      shake: 0,            // 搖晃能量 0~1
      wobble: 0,
      prev: null
    };
    const veggies = [];
    const VEG = [
      { c: '#ff8c42', s: 'slice' }, { c: '#ff8c42', s: 'slice' },   // 紅蘿蔔
      { c: '#5cb85c', s: 'leaf' },  { c: '#5cb85c', s: 'leaf' }, { c: '#7ed957', s: 'leaf' }, // 青菜
      { c: '#ffd166', s: 'cube' },  { c: '#ffd166', s: 'cube' },   // 玉米/蛋
      { c: '#ef476f', s: 'slice' }, { c: '#f8f4e3', s: 'cube' }    // 甜椒、洋蔥
    ];
    function placeStove() {
      pan.handleLen = 62 * U; pan.r = 46 * U;
      pan.restAng = 0;
      // 鍋身置於畫面中央偏下：握點 = 中心往左移 handleLen + r
      pan.restX = W / 2 - (pan.handleLen + pan.r);
      pan.restY = (view.h ? view.y + view.h * 0.72 : H * 0.6);
      if (pan.heldBy < 0) { pan.x = pan.restX; pan.y = pan.restY; pan.ang = 0; }
      if (!veggies.length) {
        VEG.forEach(v => veggies.push({ ...v, ox: (Math.random() - .5) * pan.r * 1.1, oy: (Math.random() - .5) * pan.r * 1.1,
          z: 0, vz: 0, rot: Math.random() * Math.PI, vr: 0, size: (9 + Math.random() * 5) }));
      }
    }

    // ---------- 火焰粒子 ----------
    const flames = [];
    // 火焰從鍋身下方冒出（搖晃時大火）
    function spawnFlames(intensity) {
      if (intensity < 0.05) return;
      const n = Math.round(intensity * 8);
      const cx = pan.x + Math.cos(pan.ang) * (pan.handleLen + pan.r), cy = pan.y + Math.sin(pan.ang) * (pan.handleLen + pan.r);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, rr = pan.r * (0.5 + Math.random() * 0.6);
        flames.push({
          x: cx + Math.cos(a) * rr, y: cy + pan.r * 0.4 + Math.sin(a) * rr * 0.35,
          vx: (Math.random() - .5) * 1.2 * U, vy: -(1.5 + Math.random() * 3 * (0.4 + intensity)) * U,
          life: 1, decay: 0.03 + Math.random() * 0.03,
          r: (5 + Math.random() * 6 * (0.5 + intensity)) * U
        });
      }
    }
    function drawFlames() {
      ctx.globalCompositeOperation = 'lighter';
      for (let i = flames.length - 1; i >= 0; i--) {
        const f = flames[i];
        f.x += f.vx + Math.sin(frame * 0.3 + i) * 0.4 * U; f.y += f.vy; f.life -= f.decay;
        if (f.life <= 0) { flames.splice(i, 1); continue; }
        const t = f.life;
        const col = t > 0.6 ? `rgba(255,${Math.round(200 * t)},40,${t})` : t > 0.3 ? `rgba(255,120,20,${t})` : `rgba(200,40,10,${t})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * t, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }

    // ---------- 繪製平底鍋與菜 ----------
    function drawPan() {
      const shaking = pan.shake > 0.25;
      pan.wobble = shaking ? Math.sin(frame * 0.6) * 0.18 * pan.shake : pan.wobble * 0.85;
      const ang = pan.ang + pan.wobble;
      const lift = pan.heldBy >= 0 ? 6 * U : 0;

      // 菜的物理（在鍋內座標系）
      for (const v of veggies) {
        if (shaking && Math.random() < 0.15 * pan.shake) {
          v.vz = (4 + Math.random() * 6) * U * pan.shake; v.vr = (Math.random() - .5) * 0.4;
          v.ox += (Math.random() - .5) * 8 * U; v.oy += (Math.random() - .5) * 8 * U;
        }
        v.z += v.vz; v.vz -= 0.45 * U;
        if (v.z < 0) { v.z = 0; v.vz = 0; v.vr *= 0.5; }
        v.rot += v.vr; v.vr *= 0.95;
        const lim = pan.r * 0.7, d = Math.hypot(v.ox, v.oy);
        if (d > lim) { v.ox *= lim / d; v.oy *= lim / d; }
      }

      ctx.save();
      ctx.translate(pan.x, pan.y - lift);
      ctx.rotate(ang);
      // 影子
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.ellipse(pan.handleLen + pan.r, lift + 6 * U, pan.r * 1.05, pan.r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      // 手柄
      ctx.fillStyle = '#1f1f1f';
      roundRect(-6 * U, -7 * U, pan.handleLen + 10 * U, 14 * U, 7 * U); ctx.fill();
      ctx.fillStyle = '#444'; roundRect(-2 * U, -3 * U, pan.handleLen * 0.8, 5 * U, 3 * U); ctx.fill();
      // 鍋身（略俯視：外圈金屬 + 內部深色）
      const cx = pan.handleLen + pan.r;
      ctx.fillStyle = '#9aa0a6';
      ctx.beginPath(); ctx.ellipse(cx, 0, pan.r, pan.r * 0.78, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3c3c3c';
      ctx.beginPath(); ctx.ellipse(cx, 0, pan.r * 0.82, pan.r * 0.62, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath(); ctx.ellipse(cx, 3 * U, pan.r * 0.74, pan.r * 0.54, 0, 0, Math.PI * 2); ctx.fill();
      // 油光
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      ctx.beginPath(); ctx.ellipse(cx - pan.r * .2, -pan.r * .15, pan.r * .4, pan.r * .18, -0.4, 0, Math.PI * 2); ctx.fill();

      // 菜
      const sorted = [...veggies].sort((a, b) => a.z - b.z);
      for (const v of sorted) {
        const vx = cx + v.ox, vy = v.oy * 0.78;
        // 影子
        if (v.z > 0) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(vx, vy, v.size * U * 0.7, v.size * U * 0.35, 0, 0, Math.PI * 2); ctx.fill(); }
        ctx.save(); ctx.translate(vx, vy - v.z); ctx.rotate(v.rot);
        const s = v.size * U * (1 + v.z / (60 * U));
        ctx.fillStyle = v.c;
        if (v.s === 'slice') { ctx.beginPath(); ctx.ellipse(0, 0, s * 0.6, s * 0.4, 0, 0, Math.PI * 2); ctx.fill(); }
        else if (v.s === 'cube') { ctx.fillRect(-s * 0.4, -s * 0.4, s * 0.8, s * 0.8); }
        else { ctx.beginPath(); ctx.moveTo(-s * .6, 0); ctx.quadraticCurveTo(0, -s * .6, s * .6, 0); ctx.quadraticCurveTo(0, s * .6, -s * .6, 0); ctx.fill(); }
        ctx.restore();
      }
      // 蒸氣（搖晃時）
      if (shaking) {
        ctx.fillStyle = `rgba(255,255,255,${0.15 * pan.shake})`;
        for (let i = 0; i < 3; i++) {
          const t = (frame * 0.05 + i * 2) % 3;
          ctx.beginPath(); ctx.arc(cx + (i - 1) * pan.r * .35, -pan.r * .2 - t * 18 * U, (8 + t * 6) * U, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
    }

    // ---------- 廚師帽（使用者提供的圖片，已內嵌） ----------
    const hatImg = new Image();

      const c = toScreen({ x: bb.xCenter, y: bb.yCenter });

      });

      statusEl.textContent = !handsInfo.length ? '找不到手' : pan.heldBy < 0 ? '握拳抓住鍋柄' : pan.shake > 0.25 ? '🔥 大火快炒！' : '拿起鍋子了，搖一搖';
      statusEl.style.color = pan.shake > 0.25 ? '#ff8c42' : pan.heldBy >= 0 ? '#7dd3fc' : '#fff';
    }

    // ---------- MediaPipe ----------
    const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
    hands.onResults(r => { handsResult = r; render(); });

    const faceDet = new FaceDetection({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}` });
    faceDet.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
    faceDet.onResults(r => { faceResult = r; });

    let running = false, busy = false, tick = 0;
    async function loop() {
      if (!running) return;
      if (video.readyState >= 2 && !busy) {
        busy = true;
        try {
          if (tick++ % 2 === 0) await faceDet.send({ image: video });   // 臉每兩幀偵測一次省效能
          await hands.send({ image: video });
        } finally { busy = false; }
      }
      requestAnimationFrame(loop);
    }

    async function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const sw = Math.round(window.innerWidth * dpr), sh = Math.round(window.innerHeight * dpr);
      // 依螢幕方向要求對應比例：手機直拿就要求直式影像
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: sw }, height: { ideal: sh }, aspectRatio: { ideal: sw / sh } },
        audio: false
      });
      mirror = facing === 'user';
      video.srcObject = stream;
      await new Promise(r => video.onloadedmetadata = r);
      await video.play();
      // 盡量拉到最廣角（0.5x）：若鏡頭支援 zoom，設成最小值
      const track = stream.getVideoTracks()[0];
      try {
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom) await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] });
      } catch (e) {}
      layoutVideo(); placeStove();
    }

    document.getElementById('start').addEventListener('click', async () => {
      errEl.textContent = '';
      try {
        await startCamera();
        resize();
        overlay.classList.add('hidden');
        statusEl.textContent = '載入模型中…';
        running = true; loop();
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      } catch (e) { errEl.textContent = '無法開啟鏡頭：' + (e.message || e); }
    });

    document.getElementById('flip').addEventListener('click', async () => {
      facing = facing === 'user' ? 'environment' : 'user';
      try { await startCamera(); } catch (e) { facing = facing === 'user' ? 'environment' : 'user'; }
    });

    window.addEventListener('resize', resize);
    if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(async () => {
      if (running) { try { await startCamera(); } catch (e) {} }
      resize();
    }, 300));
    video.addEventListener('resize', () => { layoutVideo(); placeStove(); });
    resize();
  </script>
</body>
</html>
