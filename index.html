<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>3D 廚師帽</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { color: #f3efe6; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  video { display: none; }
  #canvas, #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #gl { pointer-events: none; }
  #status { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 16px; font-size: 15px; font-weight: 600;
    padding: 7px 14px; border-radius: 999px; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); pointer-events: none; z-index: 5; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; z-index: 5;
    background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0)); font-size: 14px; }
  #bar button { font: inherit; font-weight: 600; color: #fff; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px); }
  #bar label { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
    background: rgba(0,0,0,.45); backdrop-filter: blur(6px); cursor: pointer; }
  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; text-align: center; padding: 32px; background: #14213d; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 30px; font-weight: 700; letter-spacing: .06em; }
  #overlay p { color: #b8c0d4; line-height: 1.7; max-width: 34ch; }
  #start { font: inherit; font-size: 18px; font-weight: 700; color: #14213d; background: #f3efe6; border: 0;
    border-radius: 999px; padding: 14px 36px; cursor: pointer; }
  #err { color: #fca5a5; font-size: 14px; }
</style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <canvas id="gl"></canvas>
  <div id="status">尚未啟動</div>
  <div id="bar">
    <label><input type="checkbox" id="showCam" checked> 鏡頭畫面</label>
    <button id="flip">🔄 切換鏡頭</button>
  </div>
  <div id="overlay">
    <h1>👨‍🍳 3D 廚師帽</h1>
    <p>把臉放到鏡頭前，頭上會戴上一頂 3D 廚師帽。<br>轉頭、仰頭、歪頭，帽子都會跟著動。</p>
    <button id="start">開啟鏡頭</button>
    <p id="err"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const glCanvas = document.getElementById('gl');
    const statusEl = document.getElementById('status');
    const overlay = document.getElementById('overlay');
    const errEl = document.getElementById('err');
    const showCam = document.getElementById('showCam');

    let W = 0, H = 0, dpr = 1;
    let view = { x: 0, y: 0, w: 0, h: 0 };
    let mirror = true, facing = 'user', stream = null;

    // ---------- 畫布 / 鏡頭配置 ----------
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.width = Math.round(window.innerWidth * dpr);
      H = canvas.height = Math.round(window.innerHeight * dpr);
      layoutVideo();
      setupThreeSize();
    }
    function layoutVideo() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) { view = { x: 0, y: 0, w: W, h: H }; return; }
      const s = Math.min(W / vw, H / vh);   // 像相機 App：保持比例、填滿寬或高、其餘留黑
      view.w = vw * s; view.h = vh * s;
      view.x = (W - view.w) / 2; view.y = (H - view.h) / 2;
    }
    const toScreen = p => ({ x: view.x + (mirror ? 1 - p.x : p.x) * view.w, y: view.y + p.y * view.h });

    // ---------- three.js 場景 ----------
    const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: true });
    renderer.setClearColor(0x000000, 0);
    const scene = new THREE.Scene();
    // 正交相機，座標直接對應螢幕像素：(0,0) 在中心，x 向右，y 向上
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -5000, 5000);
    camera.position.z = 1000;
    function setupThreeSize() {
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      camera.left = -W / 2; camera.right = W / 2; camera.top = H / 2; camera.bottom = -H / 2;
      camera.updateProjectionMatrix();
    }
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(0.4, 1, 1); scene.add(sun);
    const rim = new THREE.DirectionalLight(0xdde8ff, 0.35); rim.position.set(-0.6, 0.3, -1); scene.add(rim);

    // 廚師帽：單位 1 = 頭寬（兩耳距離）。帽底 y=0 在髮際線，+y 向上，+z 朝前(臉的方向)
    function buildHat() {
      const group = new THREE.Group();
      // 帽子外形剖面（半徑, 高度）
      const profile = [];
      const pts = [
        [0.50, 0.00], [0.52, 0.10], [0.52, 0.34],   // 帽帶
        [0.54, 0.40], [0.62, 0.55], [0.68, 0.80], [0.70, 1.05], [0.68, 1.28],
        [0.60, 1.42], [0.45, 1.50], [0.25, 1.53], [0.0, 1.54]
      ];
      for (const [r, y] of pts) profile.push(new THREE.Vector2(r, y));
      const geo = new THREE.LatheGeometry(profile, 96);
      // 加上皺褶：帽身區域半徑隨角度起伏
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const r = Math.hypot(x, z), th = Math.atan2(z, x);
        const amt = y < 0.4 ? 0 : Math.min(1, (y - 0.4) / 0.3) * Math.max(0, 1 - Math.max(0, y - 1.3) / 0.25);
        const nr = r * (1 + 0.045 * amt * Math.cos(22 * th));
        pos.setXYZ(i, Math.cos(th) * nr, y, Math.sin(th) * nr);
      }
      geo.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75, metalness: 0.0 });
      const hat = new THREE.Mesh(geo, mat);
      group.add(hat);
      // 帽帶（稍微不同色，像布邊）
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.535, 0.525, 0.34, 96, 1, true),
        new THREE.MeshStandardMaterial({ color: 0xf3f3f3, roughness: 0.9, side: THREE.DoubleSide }));
      band.position.y = 0.17; group.add(band);
      // 帽底封口（避免仰頭時看到裡面是空的）
      const bottom = new THREE.Mesh(new THREE.CircleGeometry(0.5, 64),
        new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 1, side: THREE.DoubleSide }));
      bottom.rotation.x = Math.PI / 2; bottom.position.y = 0.005; group.add(bottom);
      // 看不見的「頭」：用來遮住帽子被頭擋住的部分
      const occluder = new THREE.Mesh(new THREE.SphereGeometry(0.5, 48, 32),
        new THREE.MeshBasicMaterial({ colorWrite: false }));
      occluder.position.y = -0.5; occluder.scale.set(1, 1.15, 1); occluder.renderOrder = -1;
      group.add(occluder);
      return group;
    }
    const hat = buildHat();
    hat.visible = false;
    scene.add(hat);

    // ---------- 從臉部網格算出頭部姿態 ----------
    const smooth = { pos: new THREE.Vector3(), quat: new THREE.Quaternion(), scale: 1, ok: false };
    const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion();
    function lm3(p) {   // 轉成 three 的座標：x 向右、y 向上、z 朝鏡頭
      const s = toScreen(p);
      return new THREE.Vector3(s.x - W / 2, H / 2 - s.y, -p.z * view.w);
    }
    function updateHat(lms) {
      // 468 點中的關鍵位置
      const rEar = lm3(lms[234]), lEar = lm3(lms[454]);
      const chin = lm3(lms[152]), forehead = lm3(lms[10]);
      const rEye = lm3(lms[33]), lEye = lm3(lms[263]);
      const earMid = rEar.clone().add(lEar).multiplyScalar(0.5);
      const headW = rEar.distanceTo(lEar);

      // 建立頭部的三軸：右(耳到耳)、上(下巴到額頭)、前(叉積)
      // 螢幕座標已含鏡像，z 朝鏡頭為正，所以直接用叉積即可得到正確方向
      let right = lEar.clone().sub(rEar);
      if (right.x < 0) right.negate();       // 保證「右」指向螢幕右邊
      right.normalize();
      let up = forehead.clone().sub(chin).normalize();
      const front = new THREE.Vector3().crossVectors(right, up).normalize();
      up = new THREE.Vector3().crossVectors(front, right).normalize();
      tmpM.makeBasis(right, up, front);
      tmpQ.setFromRotationMatrix(tmpM);

      // 帽子位置：從兩耳中點沿著「上」方向移到髮際線（約 0.36 頭寬，仰頭時額頭露更多要再高一點）
      const upWorld = up.clone();
      const pitch = front.y;                 // 仰頭時 front 朝上 (>0)
      const off = headW * (0.34 + 0.12 * Math.max(0, pitch));
      const pos = earMid.clone().add(upWorld.multiplyScalar(off));
      // 帽子比頭稍微大一點點才蓋得住頭髮
      const scale = headW * 0.98;

      if (!smooth.ok) { smooth.pos.copy(pos); smooth.quat.copy(tmpQ); smooth.scale = scale; smooth.ok = true; }
      else { smooth.pos.lerp(pos, 0.45); smooth.quat.slerp(tmpQ, 0.45); smooth.scale += (scale - smooth.scale) * 0.45; }
      hat.position.copy(smooth.pos);
      hat.quaternion.copy(smooth.quat);
      hat.scale.setScalar(smooth.scale);
      hat.visible = true;
    }

    // ---------- 主繪製 ----------
    let lastSeen = 0;
    function onResults(results) {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      if (showCam.checked) {
        ctx.save();
        if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(results.image, W - view.x - view.w, view.y, view.w, view.h); }
        else ctx.drawImage(results.image, view.x, view.y, view.w, view.h);
        ctx.restore();
      }
      const faces = results.multiFaceLandmarks;
      if (faces && faces.length) { updateHat(faces[0]); lastSeen = performance.now(); statusEl.textContent = '👨‍🍳 大廚上線'; }
      else if (performance.now() - lastSeen > 500) { hat.visible = false; smooth.ok = false; statusEl.textContent = '找不到臉'; }
      renderer.render(scene, camera);
    }

    const faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults(onResults);

    let running = false, busy = false;
    async function loop() {
      if (!running) return;
      if (video.readyState >= 2 && !busy) {
        busy = true;
        try { await faceMesh.send({ image: video }); } finally { busy = false; }
      }
      requestAnimationFrame(loop);
    }

    async function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      const portrait = window.innerHeight > window.innerWidth;
      stream = await navigator.mediaDevices.getUserMedia({
        video: portrait
          ? { facingMode: facing, width: { ideal: 1440 }, height: { ideal: 1920 }, aspectRatio: { ideal: 3 / 4 } }
          : { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1440 }, aspectRatio: { ideal: 4 / 3 } },
        audio: false
      });
      mirror = facing === 'user';
      video.srcObject = stream;
      await new Promise(r => video.onloadedmetadata = r);
      await video.play();
      const track = stream.getVideoTracks()[0];
      try { const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom) await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }); } catch (e) {}
      layoutVideo();
    }

    document.getElementById('start').addEventListener('click', async () => {
      errEl.textContent = '';
      try {
        await startCamera(); resize();
        overlay.classList.add('hidden');
        statusEl.textContent = '載入模型中…';
        running = true; loop();
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      } catch (e) { errEl.textContent = '無法開啟鏡頭：' + (e.message || e); }
    });
    document.getElementById('flip').addEventListener('click', async () => {
      facing = facing === 'user' ? 'environment' : 'user';
      try { await startCamera(); } catch (e) { facing = facing === 'user' ? 'environment' : 'user'; }
    });
    window.addEventListener('resize', resize);
    if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(async () => {
      if (running) { try { await startCamera(); } catch (e) {} } resize(); }, 300));
    video.addEventListener('resize', layoutVideo);
    resize();
  </script>
</body>
</html>
