<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>大廚炒菜 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { color: #f3efe6; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  video { display: none; }
  #canvas, #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #gl { pointer-events: none; }
  #status { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 16px; font-size: 15px; font-weight: 600;
    padding: 7px 14px; border-radius: 999px; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); pointer-events: none; z-index: 5; }
  #score { position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 16px; font-size: 15px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); pointer-events: none; z-index: 5; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; z-index: 5;
    background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0)); font-size: 14px; }
  #bar button { font: inherit; font-weight: 600; color: #fff; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px); }
  #bar label { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
    background: rgba(0,0,0,.45); backdrop-filter: blur(6px); cursor: pointer; }
  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; text-align: center; padding: 32px; background: #14213d; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 30px; font-weight: 700; letter-spacing: .06em; }
  #overlay p { color: #b8c0d4; line-height: 1.7; max-width: 34ch; }
  #start { font: inherit; font-size: 18px; font-weight: 700; color: #14213d; background: #f3efe6; border: 0;
    border-radius: 999px; padding: 14px 36px; cursor: pointer; }
  #err { color: #fca5a5; font-size: 14px; }
</style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <canvas id="gl"></canvas>
  <div id="status">尚未啟動</div>
  <div id="score">🍳 0</div>
  <div id="bar">
    <label><input type="checkbox" id="showCam" checked> 鏡頭畫面</label>
    <label><input type="checkbox" id="showHands"> 手部骨架</label>
    <label><input type="checkbox" id="sound" checked> 🔊 音效</label>
    <button id="flip">🔄 切換鏡頭</button>
  </div>
  <div id="overlay">
    <h1>👨‍🍳 大廚炒菜 3D</h1>
    <p>把臉和手放到鏡頭前，頭上會戴上 3D 廚師帽。<br>蔬果會從上方飄落，用手握住它們，<br>食材會化成光飛進平底鍋，大火快炒 3 秒！</p>
    <button id="start">開啟鏡頭</button>
    <p id="err"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script>
    window.addEventListener('error', e => { const el = document.getElementById('err'); if (el) el.textContent = '程式錯誤：' + e.message; });
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const glCanvas = document.getElementById('gl');
    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const errEl = document.getElementById('err');
    const showCam = document.getElementById('showCam');
    const showHands = document.getElementById('showHands');

    let W = 0, H = 0, U = 1;
    let view = { x: 0, y: 0, w: 0, h: 0 };
    let mirror = true, facing = 'user', stream = null;
    let score = 0;

    // ---------- 畫布 / 鏡頭配置 ----------
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.width = Math.round(window.innerWidth * dpr);
      H = canvas.height = Math.round(window.innerHeight * dpr);
      U = Math.min(W, H) / 400;
      layoutVideo();
      setupThreeSize();
      placePan();
    }
    function layoutVideo() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) { view = { x: 0, y: 0, w: W, h: H }; return; }
      const s = Math.min(W / vw, H / vh);
      view.w = vw * s; view.h = vh * s;
      view.x = (W - view.w) / 2; view.y = (H - view.h) / 2;
    }
    const toScreen = p => ({ x: view.x + (mirror ? 1 - p.x : p.x) * view.w, y: view.y + p.y * view.h });
    const s2t = (sx, sy, z = 0) => new THREE.Vector3(sx - W / 2, H / 2 - sy, z);   // 螢幕 → three

    // ---------- three.js ----------
    const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: true });
    renderer.setClearColor(0x000000, 0);
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -5000, 5000);
    camera.position.z = 1000;
    function setupThreeSize() {
      renderer.setPixelRatio(1); renderer.setSize(W, H, false);
      camera.left = -W / 2; camera.right = W / 2; camera.top = H / 2; camera.bottom = -H / 2;
      camera.updateProjectionMatrix();
    }
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(0.4, 1, 1); scene.add(sun);
    const rim = new THREE.DirectionalLight(0xdde8ff, 0.35); rim.position.set(-0.6, 0.3, -1); scene.add(rim);
    const fireLight = new THREE.PointLight(0xff7a20, 0, 600); scene.add(fireLight);

    // ---------- 廚師帽 ----------
    function buildHat() {
      const group = new THREE.Group();
      const pts = [[0.50, 0.00], [0.52, 0.10], [0.52, 0.34], [0.54, 0.40], [0.62, 0.55], [0.68, 0.80], [0.70, 1.05], [0.68, 1.28],
        [0.60, 1.42], [0.45, 1.50], [0.25, 1.53], [0.0, 1.54]];
      const geo = new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), 96);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const r = Math.hypot(x, z), th = Math.atan2(z, x);
        const amt = y < 0.4 ? 0 : Math.min(1, (y - 0.4) / 0.3) * Math.max(0, 1 - Math.max(0, y - 1.3) / 0.25);
        const nr = r * (1 + 0.045 * amt * Math.cos(22 * th));
        pos.setXYZ(i, Math.cos(th) * nr, y, Math.sin(th) * nr);
      }
      geo.computeVertexNormals();
      group.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75 })));
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.535, 0.525, 0.34, 96, 1, true),
        new THREE.MeshStandardMaterial({ color: 0xf3f3f3, roughness: 0.9, side: THREE.DoubleSide }));
      band.position.y = 0.17; group.add(band);
      const bottom = new THREE.Mesh(new THREE.CircleGeometry(0.5, 64),
        new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 1, side: THREE.DoubleSide }));
      bottom.rotation.x = Math.PI / 2; bottom.position.y = 0.005; group.add(bottom);
      // 帽子正面的「總鋪師」字樣（直書、草書風、紅色）
      const tc = document.createElement('canvas'); tc.width = 256; tc.height = 800;
      const tg = tc.getContext('2d');
      tg.textAlign = 'center'; tg.textBaseline = 'middle';
      tg.font = "italic bold 190px 'STXingkai','STKaiti','KaiTi','DFKai-SB','BiauKai','Noto Serif TC','cursive',serif";
      tg.fillStyle = '#c1121f'; tg.shadowColor = 'rgba(120,0,0,.35)'; tg.shadowBlur = 8; tg.shadowOffsetY = 4;
      ['總', '鋪', '師'].forEach((ch, i) => tg.fillText(ch, 128, 150 + i * 245));
      const textTex = new THREE.CanvasTexture(tc); textTex.anisotropy = 4;
      const textMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.73, 0.66, 0.9, 40, 1, true, -0.32, 0.64),
        new THREE.MeshStandardMaterial({ map: textTex, transparent: true, roughness: 0.8, polygonOffset: true, polygonOffsetFactor: -2 }));
      textMesh.position.y = 0.88; group.add(textMesh);
      const occluder = new THREE.Mesh(new THREE.SphereGeometry(0.5, 48, 32), new THREE.MeshBasicMaterial({ colorWrite: false }));
      occluder.position.y = -0.5; occluder.scale.set(1, 1.15, 1); occluder.renderOrder = -1; group.add(occluder);
      return group;
    }
    const hat = buildHat(); hat.visible = false; scene.add(hat);
    // 半透明的「幽靈帽」：不做深度測試，所以在手遮住帽子的地方，還是會以 40% 透明度看到帽子
    const hatGhost = buildHat();
    hatGhost.children = hatGhost.children.filter(c => !(c.material && c.material.colorWrite === false));
    hatGhost.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 0.4;
      o.material.depthTest = false; o.material.depthWrite = false; o.renderOrder = 20; } });
    hatGhost.visible = false; scene.add(hatGhost);

    const smooth = { pos: new THREE.Vector3(), quat: new THREE.Quaternion(), scale: 1, ok: false };
    const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion();
    function lm3(p) { const s = toScreen(p); return new THREE.Vector3(s.x - W / 2, H / 2 - s.y, -p.z * view.w); }
    function updateHat(lms) {
      const rEar = lm3(lms[234]), lEar = lm3(lms[454]), chin = lm3(lms[152]), forehead = lm3(lms[10]);
      const earMid = rEar.clone().add(lEar).multiplyScalar(0.5);
      const headW = rEar.distanceTo(lEar);
      let right = lEar.clone().sub(rEar); if (right.x < 0) right.negate(); right.normalize();
      let up = forehead.clone().sub(chin).normalize();
      const front = new THREE.Vector3().crossVectors(right, up).normalize();
      up = new THREE.Vector3().crossVectors(front, right).normalize();
      tmpM.makeBasis(right, up, front); tmpQ.setFromRotationMatrix(tmpM);
      const pitch = front.y;
      // 帽子更大、更低一點：確實把頭髮蓋住
      const off = headW * (0.28 + 0.12 * Math.max(0, pitch));
      const pos = earMid.clone().add(up.clone().multiplyScalar(off));
      const scale = headW * 1.15;
      if (!smooth.ok) { smooth.pos.copy(pos); smooth.quat.copy(tmpQ); smooth.scale = scale; smooth.ok = true; }
      else { smooth.pos.lerp(pos, 0.45); smooth.quat.slerp(tmpQ, 0.45); smooth.scale += (scale - smooth.scale) * 0.45; }
      hat.position.copy(smooth.pos); hat.quaternion.copy(smooth.quat); hat.scale.setScalar(smooth.scale); hat.visible = true;
      hatGhost.position.copy(smooth.pos); hatGhost.quaternion.copy(smooth.quat); hatGhost.scale.setScalar(smooth.scale);
      hatGhost.visible = handOccluders.some(m => m.visible);
    }

    // ---------- 蔬果模型 ----------
    const mat = (c, r = 0.6) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
    const PRODUCE = [
      { name: '番茄', color: 0xe63946, build: () => { const g = new THREE.Group();
          g.add(new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), mat(0xe63946, 0.35)));
          const st = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.5, 8), mat(0x3a7d34)); st.position.y = 1.05; g.add(st);
          return g; } },
      { name: '橘子', color: 0xff8c1a, build: () => new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), mat(0xff8c1a, 0.85)) },
      { name: '檸檬', color: 0xffe14d, build: () => { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), mat(0xffe14d, 0.7)); m.scale.set(1.25, 0.9, 0.9); return m; } },
      { name: '紅蘿蔔', color: 0xff7a1a, build: () => { const g = new THREE.Group();
          const c = new THREE.Mesh(new THREE.ConeGeometry(0.55, 2.4, 16), mat(0xff7a1a, 0.7)); c.rotation.x = Math.PI; g.add(c);
          const lf = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.9, 8), mat(0x3fa34d)); lf.position.y = 1.5; g.add(lf); return g; } },
      { name: '茄子', color: 0x6a2c91, build: () => { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), mat(0x6a2c91, 0.4)); m.scale.set(0.7, 1.3, 0.7); return m; } },
      { name: '青花菜', color: 0x2f9e44, build: () => { const g = new THREE.Group();
          const st = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 1.2, 10), mat(0xa8d08d)); st.position.y = -0.6; g.add(st);
          for (let i = 0; i < 6; i++) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.55, 14, 10), mat(0x2f9e44, 0.95));
            const a = i / 6 * Math.PI * 2; b.position.set(Math.cos(a) * 0.5, 0.2 + Math.random() * 0.2, Math.sin(a) * 0.5); g.add(b); }
          g.add(new THREE.Mesh(new THREE.SphereGeometry(0.6, 14, 10), mat(0x2f9e44, 0.95))).position.y = 0.45; return g; } },
      { name: '蘋果', color: 0xd7263d, build: () => { const g = new THREE.Group();
          const a = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), mat(0xd7263d, 0.3)); a.scale.y = 0.92; g.add(a);
          const st = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.5, 8), mat(0x5b3a1e)); st.position.y = 1.0; g.add(st); return g; } },
      { name: '香菇', color: 0xb5803f, build: () => { const g = new THREE.Group();
          const cap = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xb5803f, 0.8)); cap.scale.y = 0.7; g.add(cap);
          const st = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.1, 10), mat(0xf3e9d2)); st.position.y = -0.5; g.add(st); return g; } },
      { name: '玉米', color: 0xffd23f, build: () => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.35, 2.4, 14), mat(0xffd23f, 0.6)); return m; } },
    ];

    PRODUCE.forEach(t => { t.template = t.build(); });   // 只建一次，之後用 clone 共用幾何體
    const makeProduce = t => t.template.clone();

    // ---------- 平底鍋 ----------
    const pan = { group: null, R: 0, baseX: 0, baseY: 0, cookUntil: 0, inner: [], t: 0 };
    function buildPan() {
      const g = new THREE.Group();
      const R = 1;
      const profile = [[0, 0], [0.78, 0], [0.86, 0.04], [0.98, 0.26], [1.0, 0.32], [0.94, 0.34], [0.92, 0.3], [0.8, 0.09], [0, 0.06]];
      const body = new THREE.Mesh(new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), 64),
        new THREE.MeshStandardMaterial({ color: 0x3b3f46, roughness: 0.45, metalness: 0.6, side: THREE.DoubleSide }));
      g.add(body);
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 1.5, 12), new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 }));
      handle.rotation.z = Math.PI / 2 + 0.12; handle.position.set(-1.65, 0.36, 0); g.add(handle);
      const joint = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.28), new THREE.MeshStandardMaterial({ color: 0x555a63, metalness: 0.7, roughness: 0.4 }));
      joint.position.set(-1.0, 0.3, 0); g.add(joint);
      // 鍋裡的油光
      const oil = new THREE.Mesh(new THREE.CircleGeometry(0.72, 48), new THREE.MeshStandardMaterial({ color: 0x8a7a40, roughness: 0.15, metalness: 0.3, transparent: true, opacity: 0.55 }));
      oil.rotation.x = -Math.PI / 2; oil.position.y = 0.07; g.add(oil);
      g.rotation.x = -0.55;   // 稍微俯視看得到鍋內
      return g;
    }
    pan.group = buildPan(); scene.add(pan.group);
    function placePan() {
      pan.R = 60 * U;
      const bottom = view.h ? Math.min(view.y + view.h, H) : H;
      pan.baseX = 0; pan.baseY = (H / 2 - bottom) + pan.R * 0.55;   // 鍋緣貼著畫面底部
      pan.group.position.set(pan.baseX, pan.baseY, 50);
      pan.group.scale.setScalar(pan.R);
    }
    // 加一顆菜到鍋裡
    function addToPan(type) {
      const m = makeProduce(type); m.scale.setScalar(0.16 + Math.random() * 0.05);
      const a = Math.random() * Math.PI * 2, r = Math.random() * 0.55;
      m.position.set(Math.cos(a) * r, 0.1, Math.sin(a) * r);
      m.rotation.set(Math.random() * 3, Math.random() * 3, 0);
      m.userData = { z: 0, vz: 0, bx: m.position.x, bz: m.position.z, vr: 0 };
      pan.group.add(m); pan.inner.push(m);
      if (pan.inner.length > 12) { const old = pan.inner.shift(); pan.group.remove(old); }
    }

    // ---------- 粒子系統（火焰 / 蒸氣 / 火花）：自寫 shader，逐顆粒子有透明度，顏色乾淨不會發黑 ----------
    const particleVS = `
      attribute float aAlpha; attribute float aSize; attribute vec3 aColor;
      varying float vAlpha; varying vec3 vColor;
      void main() { vAlpha = aAlpha; vColor = aColor;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize; }`;
    const particleFS = `
      uniform float uGlow; varying float vAlpha; varying vec3 vColor;
      void main() {
        vec2 d = gl_PointCoord - 0.5; float r = length(d) * 2.0;
        float f = clamp(1.0 - r * r, 0.0, 1.0); f *= f;
        float a = vAlpha * f;
        gl_FragColor = vec4(vColor * a, a * (1.0 - uGlow));   // premultiplied
      }`;
    function makeParticles(max, size, glow) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(max * 3), 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(new Float32Array(max * 3), 3));
      geo.setAttribute('aAlpha', new THREE.BufferAttribute(new Float32Array(max), 1));
      geo.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(max), 1));
      const m = new THREE.ShaderMaterial({ vertexShader: particleVS, fragmentShader: particleFS, uniforms: { uGlow: { value: glow } },
        transparent: true, depthWrite: false, depthTest: true,
        blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
        blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor });
      const pts = new THREE.Points(geo, m); pts.frustumCulled = false; scene.add(pts);
      return { pts, geo, max, size, list: [] };
    }
    const fireSys = makeParticles(600, 30 * U, 0.45);    // 火：帶一點發光
    const steamSys = makeParticles(300, 46 * U, 0.0);    // 白煙：純白、正常混合、慢慢變透明
    const sparkSys = makeParticles(600, 14 * U, 0.5);
    function flushParticles(sys) {
      const p = sys.geo.attributes.position.array, c = sys.geo.attributes.aColor.array;
      const al = sys.geo.attributes.aAlpha.array, sz = sys.geo.attributes.aSize.array;
      let n = 0;
      for (const q of sys.list) { if (n >= sys.max) break;
        p[n * 3] = q.x; p[n * 3 + 1] = q.y; p[n * 3 + 2] = q.z;
        c[n * 3] = q.r; c[n * 3 + 1] = q.g; c[n * 3 + 2] = q.b;
        al[n] = Math.max(0, Math.min(1, q.a)); sz[n] = sys.size * (q.s || 1); n++; }
      sys.geo.setDrawRange(0, n);
      for (const k of ['position', 'aColor', 'aAlpha', 'aSize']) sys.geo.attributes[k].needsUpdate = true;
    }

    // ---------- 卡通風格火焰：4 朵並排，用 shader 畫出鋸齒邊、三層顏色（黃芯／橘／紅邊） ----------
    const flameVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
    const flameFS = `
      uniform float uTime; uniform float uPhase; uniform float uHeat; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
        return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
      float fbm(vec2 p){ float v = 0.0, a = 0.5; for(int i=0;i<4;i++){ v += a*noise(p); p *= 2.1; a *= 0.5; } return v; }
      void main(){
        vec2 uv = vUv;
        float t = uTime * (1.6 + uHeat * 1.4) + uPhase;
        // 往上流動的亂流
        float n = fbm(vec2(uv.x * 3.0 + uPhase, uv.y * 4.0 - t)) ;
        float n2 = fbm(vec2(uv.x * 7.0 - uPhase, uv.y * 9.0 - t * 1.7));
        float x = (uv.x - 0.5) * 2.0 + (n - 0.5) * 0.9 * uv.y;   // 越上面晃越大

    const FLAME_N = 3;

    function updateFlames(now, intensity, cooking, dt) {

    // ---------- 掉落的蔬果 ----------
    const falling = [];

      m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);

        rx: (Math.random() - .5) * 1.5, ry: (Math.random() - .5) * 1.5, baseX: sx - W / 2 };

    // ---------- 光飛進鍋裡 ----------
    const lights = [];
    function launchLight(from, type) {
      const orb = new THREE.Mesh(new THREE.SphereGeometry(7 * U, 12, 10), new THREE.MeshBasicMaterial({ color: type.color }));
      orb.position.copy(from); scene.add(orb);
      const to = new THREE.Vector3(pan.baseX, pan.baseY + pan.R * 0.25, 450);
      const ctrl = from.clone().lerp(to, 0.5); ctrl.y += 120 * U; ctrl.x += (Math.random() - .5) * 120 * U;
      lights.push({ orb, from: from.clone(), ctrl, to, t: 0, type, col: new THREE.Color(type.color) });
    }

    // 消失特效：碎片噴散
    function burst(pos, colorHex, n = 40) {
      const col = new THREE.Color(colorHex);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = (60 + Math.random() * 160) * U;
        sparkSys.list.push({ x: pos.x, y: pos.y, z: 460, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 60 * U, vz: 0,
          life: 1, decay: 1.6 + Math.random() * 1.2, r: col.r, g: col.g, b: col.b, a: 1 });
      }
    }

    // ---------- 手部 ----------
    const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
    function palmCenter(lm) { const ids = [0, 5, 9, 13, 17]; let x = 0, y = 0;
      for (const i of ids) { x += lm[i].x; y += lm[i].y; } return toScreen({ x: x / ids.length, y: y / ids.length }); }
    function isClosed(lm) { const w = lm[0], d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const tips = [8, 12, 16, 20], bases = [5, 9, 13, 17]; let s = 0;
      for (let i = 0; i < 4; i++) s += d(lm[tips[i]], w) / (d(lm[bases[i]], w) + 1e-6); return s / 4 < 1.5; }
    function drawHand(lm, color) {
      ctx.lineWidth = 3 * U; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineCap = 'round';
      for (const [a, b] of CONNECTIONS) { const p = toScreen(lm[a]), q = toScreen(lm[b]); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
      ctx.fillStyle = color;

    }

    // ---------- 手的遮罩：手經過帽子前面時，帽子被挖掉，露出真實的手 ----------
    const handOccluders = [0, 1].map(() => {
      const m = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ colorWrite: false }));
      m.renderOrder = -5; m.visible = false; m.position.z = 300; scene.add(m); return m;
    });
    function convexHull(pts) {
      pts = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
      const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      const lower = []; for (const p of pts) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
      const upper = []; for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
      upper.pop(); lower.pop(); return lower.concat(upper);
    }
    function updateHandOccluders(hands) {
      handOccluders.forEach(m => m.visible = false);
      hands.slice(0, 2).forEach((h, i) => {
        const pts = h.lm.map(p => { const s = toScreen(p); return { x: s.x - W / 2, y: H / 2 - s.y }; });
        const hull = convexHull(pts); if (hull.length < 3) return;
        let cx = 0, cy = 0; for (const p of hull) { cx += p.x; cy += p.y; } cx /= hull.length; cy /= hull.length;
        const w0 = pts[0], m9 = pts[9]; const pad = Math.max(14 * U, Math.hypot(m9.x - w0.x, m9.y - w0.y) * 0.22);
        const shape = new THREE.Shape();
        hull.forEach((p, k) => { const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || 1;
          const x = p.x + dx / d * pad, y = p.y + dy / d * pad; k ? shape.lineTo(x, y) : shape.moveTo(x, y); });
        shape.closePath();
        const m = handOccluders[i]; m.geometry.dispose(); m.geometry = new THREE.ShapeGeometry(shape); m.visible = true;
      });
    }

    // ---------- 音效（全部用 Web Audio 合成，不需要外部音檔） ----------
    const soundBox = document.getElementById('sound');
    let AC = null, master = null, sizzle = null;
    function initAudio() {
      if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
      // 白噪音來源（煎/炒的底聲）
      const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3800; bp.Q.value = 0.6;
      const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;

    function playCrackle(strength) {   // 油爆的短促「啪」
      if (!AC || !soundBox.checked) return;
      const t = AC.currentTime, len = AC.sampleRate * 0.06, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const src = AC.createBufferSource(); src.buffer = buf;
      const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2500 + Math.random() * 4000; f.Q.value = 1.5;
      const g = AC.createGain(); g.gain.value = 0.25 * strength;
      src.connect(f); f.connect(g); g.connect(master); src.start(t);
    }
    function playPoof() {   // 蔬果消失：氣音 + 往上滑的亮音
      if (!AC || !soundBox.checked) return;
      const t = AC.currentTime;
      const len = AC.sampleRate * 0.25, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.5);
      const src = AC.createBufferSource(); src.buffer = buf;
      const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(6000, t); f.frequency.exponentialRampToValueAtTime(600, t + 0.25);
      const g = AC.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      src.connect(f); f.connect(g); g.connect(master); src.start(t);
      const o = AC.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(1900, t + 0.18);
      const og = AC.createGain(); og.gain.setValueAtTime(0.18, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(og); og.connect(master); o.start(t); o.stop(t + 0.32);

      if (!AC || !soundBox.checked) return;

      [1800, 2700, 4100].forEach((fr, i) => {
        const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = fr * (0.97 + Math.random() * 0.06);
        const g = AC.createGain(); g.gain.setValueAtTime(0.08 / (i + 1), t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.13);

    }
    let crackleTimer = 0, clankTimer = 0;
    function updateAudio(cooking, dt) {

      sizzle.g.gain.setTargetAtTime(target, AC.currentTime, 0.15);

      if (crackleTimer <= 0) { playCrackle(cooking ? 1 : 0.35); crackleTimer = cooking ? 0.03 + Math.random() * 0.08 : 0.25 + Math.random() * 0.6; }
      if (cooking) { clankTimer -= dt; if (clankTimer <= 0) { playClank(); clankTimer = 0.18 + Math.random() * 0.25; } }
    }

    // ---------- 主更新 ----------
    let faceResult = null, handsResult = null, lastFace = 0, lastT = performance.now();
    function frameUpdate() {
      const now = performance.now(); const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;

      // 影像
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      const img = handsResult && handsResult.image;
      if (showCam.checked && img) {
        ctx.save();
        if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(img, W - view.x - view.w, view.y, view.w, view.h); }
        else ctx.drawImage(img, view.x, view.y, view.w, view.h);

      // 生成蔬果
      spawnTimer -= dt;
      if (spawnTimer <= 0 && falling.length < 6) { spawnProduce(); spawnTimer = 1.0 + Math.random() * 1.2; }

      // 蔬果掉落 + 抓取

      const bottomY = -(H / 2) - 80 * U;   // 完全掉出螢幕底部後自動刪除

        }

          vx: (Math.random() - .5) * 30 * U, vy: (Math.random() - .5) * 30 * U, vz: 0, life: 1, decay: 3, r: L.col.r, g: L.col.g, b: L.col.b, a: 1 });
        if (L.t >= 1) {
          scene.remove(L.orb); lights.splice(i, 1);

          burst(L.to, 0xffe08a, 30);

          score++; scoreEl.textContent = '🍳 ' + score;
        }
      }

      // 鍋子動畫
      const cooking = now < pan.cookUntil;
      const intensity = cooking ? 1 : 0.22;
      pan.t += dt;
      if (cooking) {
        const k = pan.t * 13;
        pan.group.rotation.z = Math.sin(k) * 0.16;
        pan.group.position.y = pan.baseY + Math.abs(Math.sin(k * 0.5)) * 14 * U;
        pan.group.position.x = pan.baseX + Math.sin(k) * 10 * U;
        for (const v of pan.inner) { const u = v.userData;
          if (u.z <= 0 && Math.random() < 0.08) { u.vz = 1.2 + Math.random() * 1.6; u.vr = (Math.random() - .5) * 8; }
          u.vz -= 7 * dt; u.z = Math.max(0, u.z + u.vz * dt); if (u.z === 0) u.vz = 0;

        pan.group.rotation.z += (idleRot - pan.group.rotation.z) * 0.15;
        pan.group.position.y += (idleY - pan.group.position.y) * 0.15;
        pan.group.position.x += (pan.baseX - pan.group.position.x) * 0.2;

      }

      for (let i = 0; i < nEmber; i++) if (Math.random() < 0.7) {

          vx: (Math.random() - .5) * 50 * U, vy: (90 + Math.random() * 120) * U * (0.7 + intensity), vz: 0,
          life: 1, decay: 1.2 + Math.random() * 1.2, r: 1, g: 0.6, b: 0.1, a: 1, s: 0.25 + Math.random() * 0.3 });

        q.x += (q.vx + Math.sin(now * 0.008 + i) * 25 * U) * dt; q.y += q.vy * dt;

          vx: (Math.random() - .5) * 25 * U, vy: (40 + Math.random() * 40) * U, vz: 0, life: 1, decay: 0.45 + Math.random() * 0.3, r: 1, g: 1, b: 1, a: 0.6 });
      }
      for (let i = steamSys.list.length - 1; i >= 0; i--) { const q = steamSys.list[i];
        q.life -= q.decay * dt; if (q.life <= 0) { steamSys.list.splice(i, 1); continue; }
        q.x += (q.vx + Math.sin(now * 0.003 + i) * 12 * U) * dt; q.y += q.vy * dt;
        q.s = 0.7 + (1 - q.life) * 1.3; q.a = Math.min(1, (1 - q.life) * 4) * q.life * 0.7; q.r = q.g = q.b = 1; }

      for (let i = sparkSys.list.length - 1; i >= 0; i--) { const q = sparkSys.list[i];

        q.vy -= 250 * U * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.a = q.life; }

      updateAudio(cooking, dt);
      renderer.render(scene, camera);

      statusEl.textContent = cooking ? '🔥 大火快炒！' : !hands.length ? (faces && faces.length ? '伸出手來抓蔬果' : '找不到臉和手') : '握拳抓住飄落的蔬果';

    // ---------- MediaPipe ----------
    const faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults(r => { faceResult = r; });
    const handsMP = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    handsMP.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });

    let running = false, busy = false, tick = 0;
    async function loop() {
      if (!running) return;
      if (video.readyState >= 2 && !busy) {
        busy = true;
        try {
          if (tick++ % 2 === 0) await faceMesh.send({ image: video });
          await handsMP.send({ image: video });

        frameUpdate();
      }
      requestAnimationFrame(loop);
    }

    async function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      const portrait = window.innerHeight > window.innerWidth;
      stream = await navigator.mediaDevices.getUserMedia({
        video: portrait
          ? { facingMode: facing, width: { ideal: 1440 }, height: { ideal: 1920 }, aspectRatio: { ideal: 3 / 4 } }
          : { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1440 }, aspectRatio: { ideal: 4 / 3 } },
        audio: false });
      mirror = facing === 'user';
      video.srcObject = stream;
      await new Promise(r => video.onloadedmetadata = r);
      await video.play();
      const track = stream.getVideoTracks()[0];
      try { const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom) await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }); } catch (e) {}
      layoutVideo(); placePan();
    }
    document.getElementById('start').addEventListener('click', async () => {
      errEl.textContent = '';
      try { initAudio(); } catch (e) {}
      try { await startCamera(); resize(); overlay.classList.add('hidden'); statusEl.textContent = '載入模型中…';
        running = true; lastT = performance.now(); loop();
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      } catch (e) { errEl.textContent = '無法開啟鏡頭：' + (e.message || e); }
    });
    soundBox.addEventListener('change', () => { try { initAudio(); } catch (e) {} });
    document.getElementById('flip').addEventListener('click', async () => {
      facing = facing === 'user' ? 'environment' : 'user';
      try { await startCamera(); } catch (e) { facing = facing === 'user' ? 'environment' : 'user'; }
    });
    window.addEventListener('resize', resize);
    if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(async () => {
      if (running) { try { await startCamera(); } catch (e) {} } resize(); }, 300));
    video.addEventListener('resize', () => { layoutVideo(); placePan(); });
    resize();
  </script>
</body>
</html>
