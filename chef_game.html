<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>大廚炒菜</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { color: #f3efe6; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  video { display: none; }
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #status { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 16px; font-size: 15px; font-weight: 600;
    padding: 7px 14px; border-radius: 999px; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); pointer-events: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
    background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0)); font-size: 14px; }
  #bar label { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
    background: rgba(0,0,0,.45); backdrop-filter: blur(6px); cursor: pointer; }
  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; text-align: center; padding: 32px; background: #14213d; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 30px; font-weight: 700; letter-spacing: .06em; }
  #overlay p { color: #b8c0d4; line-height: 1.7; max-width: 34ch; }
  #start { font: inherit; font-size: 18px; font-weight: 700; color: #14213d; background: #f3efe6; border: 0;
    border-radius: 999px; padding: 14px 36px; cursor: pointer; }
  #err { color: #fca5a5; font-size: 14px; }
</style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <div id="status">尚未啟動</div>
  <div id="bar">
    <label><input type="checkbox" id="showCam" checked> 鏡頭畫面</label>
    <label><input type="checkbox" id="showHands" checked> 顯示手部骨架</label>
  </div>
  <div id="overlay">
    <h1>👨‍🍳 大廚炒菜</h1>
    <p>把臉和手放到鏡頭前，頭上會戴上廚師帽。<br>握拳抓住平底鍋的手柄就能拿起鍋子，<br>用力搖晃，爐火會變大、菜會在鍋裡翻飛！</p>
    <button id="start">開啟鏡頭</button>
    <p id="err"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const overlay = document.getElementById('overlay');
    const errEl = document.getElementById('err');
    const showCam = document.getElementById('showCam');
    const showHands = document.getElementById('showHands');

    let W = 0, H = 0, U = 1;                 // U：以最短邊為基準的尺寸單位
    let view = { x: 0, y: 0, w: 0, h: 0 };   // 鏡頭影像貼上的區域
    let frame = 0;

    // ---------- 畫布 / 鏡頭配置 ----------
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.width = Math.round(window.innerWidth * dpr);
      H = canvas.height = Math.round(window.innerHeight * dpr);
      U = Math.min(W, H) / 400;
      layoutVideo();
      placeStove();
    }
    function layoutVideo() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) { view = { x: 0, y: 0, w: W, h: H }; return; }
      const cover = Math.max(W / vw, H / vh), contain = Math.min(W / vw, H / vh);
      const s = cover / contain <= 1.15 ? cover : contain;
      view.w = vw * s; view.h = vh * s;
      view.x = (W - view.w) / 2; view.y = (H - view.h) / 2;
    }
    const toScreen = p => ({ x: view.x + (1 - p.x) * view.w, y: view.y + p.y * view.h });

    // ---------- 炒台與平底鍋 ----------
    const stove = { x: 0, y: 0, w: 0, h: 0, bx: 0, by: 0, br: 0 };  // b = 爐口
    const pan = {
      x: 0, y: 0,          // 手柄握點
      ang: 0,              // 鍋身方向（弧度）
      restX: 0, restY: 0, restAng: 0,
      heldBy: -1,          // 哪一隻手拿著（-1 = 沒有）
      handleLen: 0, r: 0,
      shake: 0,            // 搖晃能量 0~1
      wobble: 0,
      prev: null
    };
    const veggies = [];
    const VEG = [
      { c: '#ff8c42', s: 'slice' }, { c: '#ff8c42', s: 'slice' },   // 紅蘿蔔
      { c: '#5cb85c', s: 'leaf' },  { c: '#5cb85c', s: 'leaf' }, { c: '#7ed957', s: 'leaf' }, // 青菜
      { c: '#ffd166', s: 'cube' },  { c: '#ffd166', s: 'cube' },   // 玉米/蛋
      { c: '#ef476f', s: 'slice' }, { c: '#f8f4e3', s: 'cube' }    // 甜椒、洋蔥
    ];
    function placeStove() {
      stove.w = 240 * U; stove.h = 90 * U;
      stove.x = W / 2 - stove.w / 2; stove.y = H * 0.62;
      stove.bx = W / 2; stove.by = stove.y + stove.h * 0.45; stove.br = 52 * U;
      pan.handleLen = 62 * U; pan.r = 46 * U;
      pan.restAng = 0;
      // 讓鍋身正好在爐口上：握點 = 爐口中心往左移 handleLen + r
      pan.restX = stove.bx - (pan.handleLen + pan.r); pan.restY = stove.by;
      if (pan.heldBy < 0) { pan.x = pan.restX; pan.y = pan.restY; pan.ang = 0; }
      if (!veggies.length) {
        VEG.forEach(v => veggies.push({ ...v, ox: (Math.random() - .5) * pan.r * 1.1, oy: (Math.random() - .5) * pan.r * 1.1,
          z: 0, vz: 0, rot: Math.random() * Math.PI, vr: 0, size: (9 + Math.random() * 5) }));
      }
    }

    // ---------- 火焰粒子 ----------
    const flames = [];
    function spawnFlames(intensity) {
      const n = Math.round(1 + intensity * 7);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, rr = stove.br * (0.55 + Math.random() * 0.45);
        flames.push({
          x: stove.bx + Math.cos(a) * rr, y: stove.by + Math.sin(a) * rr * 0.35,
          vx: (Math.random() - .5) * 1.2 * U, vy: -(1.5 + Math.random() * 2.5 * (0.4 + intensity)) * U,
          life: 1, decay: 0.03 + Math.random() * 0.03,
          r: (5 + Math.random() * 6 * (0.5 + intensity)) * U
        });
      }
    }
    function drawFlames() {
      ctx.globalCompositeOperation = 'lighter';
      for (let i = flames.length - 1; i >= 0; i--) {
        const f = flames[i];
        f.x += f.vx + Math.sin(frame * 0.3 + i) * 0.4 * U; f.y += f.vy; f.life -= f.decay;
        if (f.life <= 0) { flames.splice(i, 1); continue; }
        const t = f.life;
        const col = t > 0.6 ? `rgba(255,${Math.round(200 * t)},40,${t})` : t > 0.3 ? `rgba(255,120,20,${t})` : `rgba(200,40,10,${t})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * t, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // ---------- 繪製炒台 ----------
    function drawStove() {
      const { x, y, w, h, bx, by, br } = stove;
      // 台面
      ctx.fillStyle = '#2b2f36';
      roundRect(x, y, w, h, 14 * U); ctx.fill();
      ctx.fillStyle = '#3a3f48'; roundRect(x + 6 * U, y + 6 * U, w - 12 * U, h - 12 * U, 10 * U); ctx.fill();
      // 爐口
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(bx, by, br, br * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#555'; ctx.lineWidth = 3 * U; ctx.stroke();
      // 爐架
      ctx.strokeStyle = '#888'; ctx.lineWidth = 3 * U;
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4;
        ctx.beginPath(); ctx.moveTo(bx + Math.cos(a) * br * 0.3, by + Math.sin(a) * br * 0.12);
        ctx.lineTo(bx + Math.cos(a) * br, by + Math.sin(a) * br * 0.4); ctx.stroke();
      }
      // 旋鈕
      ctx.fillStyle = '#c0392b';
      ctx.beginPath(); ctx.arc(x + 30 * U, y + h - 22 * U, 9 * U, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + w - 30 * U, y + h - 22 * U, 9 * U, 0, Math.PI * 2); ctx.fill();
    }
    function roundRect(x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }

    // ---------- 繪製平底鍋與菜 ----------
    function drawPan() {
      const shaking = pan.shake > 0.25;
      pan.wobble = shaking ? Math.sin(frame * 0.6) * 0.18 * pan.shake : pan.wobble * 0.85;
      const ang = pan.ang + pan.wobble;
      const lift = pan.heldBy >= 0 ? 6 * U : 0;

      // 菜的物理（在鍋內座標系）
      for (const v of veggies) {
        if (shaking && Math.random() < 0.15 * pan.shake) {
          v.vz = (4 + Math.random() * 6) * U * pan.shake; v.vr = (Math.random() - .5) * 0.4;
          v.ox += (Math.random() - .5) * 8 * U; v.oy += (Math.random() - .5) * 8 * U;
        }
        v.z += v.vz; v.vz -= 0.45 * U;
        if (v.z < 0) { v.z = 0; v.vz = 0; v.vr *= 0.5; }
        v.rot += v.vr; v.vr *= 0.95;
        const lim = pan.r * 0.7, d = Math.hypot(v.ox, v.oy);
        if (d > lim) { v.ox *= lim / d; v.oy *= lim / d; }
      }

      ctx.save();
      ctx.translate(pan.x, pan.y - lift);
      ctx.rotate(ang);
      // 影子
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.ellipse(pan.handleLen + pan.r, lift + 6 * U, pan.r * 1.05, pan.r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      // 手柄
      ctx.fillStyle = '#1f1f1f';
      roundRect(-6 * U, -7 * U, pan.handleLen + 10 * U, 14 * U, 7 * U); ctx.fill();
      ctx.fillStyle = '#444'; roundRect(-2 * U, -3 * U, pan.handleLen * 0.8, 5 * U, 3 * U); ctx.fill();
      // 鍋身（略俯視：外圈金屬 + 內部深色）
      const cx = pan.handleLen + pan.r;
      ctx.fillStyle = '#9aa0a6';
      ctx.beginPath(); ctx.ellipse(cx, 0, pan.r, pan.r * 0.78, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3c3c3c';
      ctx.beginPath(); ctx.ellipse(cx, 0, pan.r * 0.82, pan.r * 0.62, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath(); ctx.ellipse(cx, 3 * U, pan.r * 0.74, pan.r * 0.54, 0, 0, Math.PI * 2); ctx.fill();
      // 油光
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      ctx.beginPath(); ctx.ellipse(cx - pan.r * .2, -pan.r * .15, pan.r * .4, pan.r * .18, -0.4, 0, Math.PI * 2); ctx.fill();

      // 菜
      const sorted = [...veggies].sort((a, b) => a.z - b.z);
      for (const v of sorted) {
        const vx = cx + v.ox, vy = v.oy * 0.78;
        // 影子
        if (v.z > 0) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(vx, vy, v.size * U * 0.7, v.size * U * 0.35, 0, 0, Math.PI * 2); ctx.fill(); }
        ctx.save(); ctx.translate(vx, vy - v.z); ctx.rotate(v.rot);
        const s = v.size * U * (1 + v.z / (60 * U));
        ctx.fillStyle = v.c;
        if (v.s === 'slice') { ctx.beginPath(); ctx.ellipse(0, 0, s * 0.6, s * 0.4, 0, 0, Math.PI * 2); ctx.fill(); }
        else if (v.s === 'cube') { ctx.fillRect(-s * 0.4, -s * 0.4, s * 0.8, s * 0.8); }
        else { ctx.beginPath(); ctx.moveTo(-s * .6, 0); ctx.quadraticCurveTo(0, -s * .6, s * .6, 0); ctx.quadraticCurveTo(0, s * .6, -s * .6, 0); ctx.fill(); }
        ctx.restore();
      }
      // 蒸氣（搖晃時）
      if (shaking) {
        ctx.fillStyle = `rgba(255,255,255,${0.15 * pan.shake})`;
        for (let i = 0; i < 3; i++) {
          const t = (frame * 0.05 + i * 2) % 3;
          ctx.beginPath(); ctx.arc(cx + (i - 1) * pan.r * .35, -pan.r * .2 - t * 18 * U, (8 + t * 6) * U, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
    }

    // ---------- 廚師帽 ----------
    let faceResult = null;
    function drawChefHat() {
      if (!faceResult || !faceResult.detections || !faceResult.detections.length) return;
      const det = faceResult.detections[0];
      const bb = det.boundingBox;
      const c = toScreen({ x: bb.xCenter, y: bb.yCenter });
      const w = bb.width * view.w, h = bb.height * view.h;
      // 用雙眼算傾斜角
      let ang = 0;
      const kp = det.landmarks;
      if (kp && kp.length >= 2) {
        const r = toScreen(kp[0]), l = toScreen(kp[1]);
        ang = Math.atan2(l.y - r.y, l.x - r.x);
        if (Math.abs(ang) > Math.PI / 2) ang += ang > 0 ? -Math.PI : Math.PI;
      }
      const top = c.y - h * 0.55;
      ctx.save();
      ctx.translate(c.x, top); ctx.rotate(ang);
      const hw = w * 0.62, band = h * 0.2;
      // 帽子本體（蓬鬆頂）
      ctx.fillStyle = '#f7f7f7'; ctx.strokeStyle = '#d0d0d0'; ctx.lineWidth = 2 * U;
      ctx.beginPath(); ctx.ellipse(0, -band - h * 0.45, hw * 1.15, h * 0.42, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      for (const [dx, dy, rr] of [[-0.8, -0.72, 0.42], [0, -0.85, 0.48], [0.8, -0.72, 0.42]]) {
        ctx.beginPath(); ctx.ellipse(dx * hw, -band - h * dy - h * 0.15, hw * rr, h * 0.33, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      // 帽帶
      ctx.fillStyle = '#ffffff';
      roundRect(-hw, -band, hw * 2, band, 6 * U); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e6e6e6'; roundRect(-hw, -band * 0.35, hw * 2, band * 0.35, 4 * U); ctx.fill();
      ctx.restore();
    }

    // ---------- 手部 ----------
    const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
    function palmCenter(lm) {
      const ids = [0, 5, 9, 13, 17]; let x = 0, y = 0;
      for (const i of ids) { x += lm[i].x; y += lm[i].y; }
      return toScreen({ x: x / ids.length, y: y / ids.length });
    }
    function isClosed(lm) {
      const wrist = lm[0], d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const tips = [8, 12, 16, 20], bases = [5, 9, 13, 17]; let sum = 0;
      for (let i = 0; i < 4; i++) sum += d(lm[tips[i]], wrist) / (d(lm[bases[i]], wrist) + 1e-6);
      return sum / 4 < 1.45;
    }
    function drawHand(lm, color) {
      ctx.lineWidth = 4 * U; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineCap = 'round';
      for (const [a, b] of CONNECTIONS) { const p = toScreen(lm[a]), q = toScreen(lm[b]);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
      ctx.fillStyle = color;
      for (let i = 0; i < 21; i++) { const p = toScreen(lm[i]);
        ctx.beginPath(); ctx.arc(p.x, p.y, (i % 4 === 0 && i > 0 ? 7 : 4.5) * U, 0, Math.PI * 2); ctx.fill(); }
    }

    // ---------- 主繪製 ----------
    let handsResult = null;
    function render() {
      frame++;
      ctx.fillStyle = showCam.checked ? '#000' : '#14213d'; ctx.fillRect(0, 0, W, H);
      if (showCam.checked && handsResult) {
        ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
        ctx.drawImage(handsResult.image, W - view.x - view.w, view.y, view.w, view.h);
        ctx.restore();
      }
      drawChefHat();

      // 手
      const handsInfo = [];
      if (handsResult && handsResult.multiHandLandmarks) {
        handsResult.multiHandLandmarks.forEach((lm, i) => {
          const palm = palmCenter(lm), closed = isClosed(lm);
          // 手柄方向：從小指側(17)到拇指側(5)，握拳握住手柄時手柄穿過這條線
          const a = toScreen(lm[17]), b = toScreen(lm[5]);
          const dir = Math.atan2(b.y - a.y, b.x - a.x);
          handsInfo.push({ palm, closed, dir });
        });
      }

      // 抓鍋 / 放鍋
      if (pan.heldBy >= 0) {
        const hnd = handsInfo[pan.heldBy];
        if (!hnd || !hnd.closed) { pan.heldBy = -1; pan.prev = null; }
      }
      if (pan.heldBy < 0) {
        for (let i = 0; i < handsInfo.length; i++) {
          const hnd = handsInfo[i];
          // 握點附近（手柄整段都算）
          const gx = pan.x + Math.cos(pan.ang) * pan.handleLen * 0.4, gy = pan.y + Math.sin(pan.ang) * pan.handleLen * 0.4;
          if (hnd.closed && Math.hypot(hnd.palm.x - gx, hnd.palm.y - gy) < 55 * U) { pan.heldBy = i; break; }
        }
      }

      if (pan.heldBy >= 0) {
        const hnd = handsInfo[pan.heldBy];
        // 平滑跟隨
        pan.x += (hnd.palm.x - pan.x) * 0.6; pan.y += (hnd.palm.y - pan.y) * 0.6;
        let da = hnd.dir - pan.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
        pan.ang += da * 0.35;
        // 搖晃能量：手掌速度
        if (pan.prev) {
          const v = Math.hypot(hnd.palm.x - pan.prev.x, hnd.palm.y - pan.prev.y) / U;
          pan.shake += ((v > 4 ? Math.min(1, v / 22) : 0) - pan.shake) * 0.15;
        }
        pan.prev = { x: hnd.palm.x, y: hnd.palm.y };
      } else {
        // 放回炒台
        pan.x += (pan.restX - pan.x) * 0.2; pan.y += (pan.restY - pan.y) * 0.2;
        let da = pan.restAng - pan.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); pan.ang += da * 0.2;
        pan.shake *= 0.85;
      }

      // 爐火：平常小火，搖晃時大火
      spawnFlames(0.08 + pan.shake);
      drawStove();
      drawFlames();
      drawPan();

      if (showHands.checked) handsInfo.forEach((h, i) => {
        drawHand(handsResult.multiHandLandmarks[i], pan.heldBy === i ? '#7dd3fc' : h.closed ? '#fbbf24' : '#4ade80');
      });

      statusEl.textContent = !handsInfo.length ? '找不到手' : pan.heldBy < 0 ? '握拳抓住鍋柄' : pan.shake > 0.25 ? '🔥 大火快炒！' : '拿起鍋子了，搖一搖';
      statusEl.style.color = pan.shake > 0.25 ? '#ff8c42' : pan.heldBy >= 0 ? '#7dd3fc' : '#fff';
    }

    // ---------- MediaPipe ----------
    const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
    hands.onResults(r => { handsResult = r; render(); });

    const faceDet = new FaceDetection({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}` });
    faceDet.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
    faceDet.onResults(r => { faceResult = r; });

    let running = false, busy = false, tick = 0;
    async function loop() {
      if (!running) return;
      if (video.readyState >= 2 && !busy) {
        busy = true;
        try {
          if (tick++ % 2 === 0) await faceDet.send({ image: video });   // 臉每兩幀偵測一次省效能
          await hands.send({ image: video });
        } finally { busy = false; }
      }
      requestAnimationFrame(loop);
    }

    document.getElementById('start').addEventListener('click', async () => {
      errEl.textContent = '';
      try {
        const portrait = window.innerHeight > window.innerWidth;
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: portrait ? 720 : 1280 }, height: { ideal: portrait ? 1280 : 720 } }, audio: false });
        video.srcObject = stream;
        await new Promise(r => video.onloadedmetadata = r);
        await video.play();
        resize();
        overlay.classList.add('hidden');
        statusEl.textContent = '載入模型中…';
        running = true; loop();
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      } catch (e) { errEl.textContent = '無法開啟鏡頭：' + (e.message || e); }
    });

    window.addEventListener('resize', resize);
    if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(resize, 300));
    video.addEventListener('resize', () => { layoutVideo(); });
    resize();
  </script>
</body>
</html>
